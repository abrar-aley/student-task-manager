{% extends "base.html" %}
{% block title %}Sign up{% endblock %}

{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="glass-panel p-4" style="width: 100%; max-width: 380px;">
    <h4 class="mb-3">Create your account</h4>
    <form method="POST">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required minlength="8">
      </div>
      <button type="submit" class="btn btn-accent w-100 mt-2">Sign up</button>
    </form>
    <p class="text-muted-app mt-3 mb-0 text-center" style="font-size: 0.85rem;">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent);">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
