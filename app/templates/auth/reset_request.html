{% extends "base.html" %}
{% block title %}Reset password{% endblock %}

{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="glass-panel p-4" style="width: 100%; max-width: 380px;">
    <h4 class="mb-2">Reset your password</h4>
    <p class="text-muted-app mb-3" style="font-size: 0.85rem;">Enter your email and we'll send you a reset link.</p>
    <form method="POST">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <button type="submit" class="btn btn-accent w-100 mt-2">Send reset link</button>
    </form>
    <p class="text-muted-app mt-3 mb-0 text-center" style="font-size: 0.85rem;">
      <a href="{{ url_for('auth.login') }}" style="color: var(--accent);">Back to log in</a>
    </p>
  </div>
</div>
{% endblock %}
