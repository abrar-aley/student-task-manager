{% extends "base.html" %}
{% block title %}Set new password{% endblock %}

{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="glass-panel p-4" style="width: 100%; max-width: 380px;">
    <h4 class="mb-3">Set a new password</h4>
    <form method="POST">
      <div class="mb-3">
        <label>New password</label>
        <input type="password" name="password" class="form-control" required minlength="8" autofocus>
      </div>
      <button type="submit" class="btn btn-accent w-100 mt-2">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
